<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导入文献 - 文献管家</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page { max-width: 720px; margin: 0 auto; padding: 30px 20px; overflow-y: auto; height: 100vh; }
    .dropzone {
      border: 2px dashed #c3cad4; border-radius: 14px;
      padding: 60px 20px; text-align: center; cursor: pointer;
      background: #fff; color: var(--text-2); transition: all .2s;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .dropzone .big { font-size: 40px; margin-bottom: 10px; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
    .back { color: var(--text-2); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 14px; }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← 返回文献库</a>

    <!-- 第一步：上传 -->
    <div id="step-upload">
      <div class="dropzone" id="dropzone">
        <div class="big">📄</div>
        <div>拖入 PDF 文件，或点击选择</div>
        <div style="font-size:12.5px; margin-top:8px">上传后自动提取标题 / 作者 / DOI / 摘要</div>
        <div style="font-size:12px; margin-top:6px; color:var(--text-2)" id="import-pdf-dir"></div>
      </div>
      <input type="file" id="file-input" accept=".pdf" style="display:none">
    </div>

    <!-- 第二步：确认元数据 -->
    <div id="step-form" style="display:none">
      <div class="panel">
        <h3 style="margin-bottom:14px">确认文献信息</h3>
        <div class="form-row">
          <label>标题 *</label>
          <input type="text" id="f-title">
        </div>
        <div class="form-grid">
          <div class="form-row"><label>第一作者</label><input type="text" id="f-first"></div>
          <div class="form-row"><label>通讯作者</label><input type="text" id="f-corr"></div>
        </div>
        <div class="form-row">
          <label>全部作者（逗号分隔）</label>
          <input type="text" id="f-authors">
        </div>
        <div class="form-grid">
          <div class="form-row"><label>主题</label><input type="text" id="f-subject" placeholder="如：计算机视觉"></div>
          <div class="form-row"><label>发表年份</label><input type="number" id="f-year"></div>
        </div>
        <div class="form-row"><label>期刊</label><input type="text" id="f-journal"></div>
        <div class="form-grid">
          <div class="form-row"><label>卷</label><input type="text" id="f-volume"></div>
          <div class="form-row"><label>期</label><input type="text" id="f-issue"></div>
        </div>
        <div class="form-row">
          <label>DOI</label>
          <div style="display:flex; gap:8px">
            <input type="text" id="f-doi" style="flex:1">
            <button class="btn" id="btn-doi-lookup">联网补全</button>
          </div>
        </div>
        <div class="form-row">
          <label>摘要</label>
          <textarea id="f-abstract" rows="4"></textarea>
        </div>
        <div class="form-row">
          <label>补充材料（可选，可多个：SI PDF / 附录等）</label>
          <div style="display:flex; gap:8px; align-items:center">
            <button class="btn" id="btn-add-supp">＋ 添加补充材料 PDF</button>
            <span style="font-size:12.5px; color:var(--text-2)">上传后在阅读器中可侧边栏切换</span>
          </div>
          <input type="file" id="supp-input" accept=".pdf" multiple style="display:none">
          <div id="supp-list" style="margin-top:8px"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:6px">
          <button class="btn" id="btn-back">重新选择文件</button>
          <button class="btn primary" id="btn-confirm">保存入库</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/import.js"></script>
</body>
</html>
